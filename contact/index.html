<div class="contact-container">
    <div class="contact-form">
        <h2>Contacto</h2>
        <p>Rellena el formulario para ponerte en contacto conmigo.</p>
        
        <form id="contactForm" action="practica_formularios.php" method="post">
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre"><br><br>  
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="Tu correo electrónico"><br><br>
            <label for="Comisión">¿Qué es lo que estás buscando?</label><br>
            <select id="Comisión" name="comisión">
                <option value="Ilustration">Ilustración</option>
                <option value="Storyboard">Storyboard</option>
                <option value="Character sheet/Design">Hoja de personaje/Diseño</option>
                <option value="Concept art">Arte conceptual</option>
                <option value="Short 2D/3D Animation">Animación corta 2D/3D</option>
                <option value="Long 2D/3D Animation">Animación larga 2D/3D</option>
                <option value="Rigged Character">Personaje riggeado</option>
                <option value="Rendering">Renderizado</option>
                <option value="Other">Otro</option>
            </select><br><br>
            <button type="submit" id="enviarBtn" class="button">Enviar</button>
        </form>
    </div>

    <div class="contact-info">
        <h3>Colaboraciones</h3>
        <p>Para colaboraciones o propuestas de trabajo, selecciona "Otro" en el formulario.</p>
        <p>También podes escribirme directamente a: <a href="Levainfigueroa10@gmail.com"></a></p>
    </div>
</div>
